<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DalisApp | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body class="auth-page">
  <main class="phone-shell auth-shell">
    <section class="auth-hero">
      <div class="brand-mark brand-mark--large">DalisApp</div>
      <p class="auth-subtitle">Control simple y amable de tus horas extras</p>
    </section>

    <section class="auth-panel">
      <div class="section-heading">
        <p class="eyebrow">Bienvenida</p>
        <h1>Iniciar sesion</h1>
        <p class="muted">Usa PocketBase si ya lo tienes levantado. Si no, puedes entrar en modo demo.</p>
      </div>

      <form id="login-form" class="stack-md">
        <label class="field">
          <span>Correo electronico</span>
          <input id="email" name="email" type="email" placeholder="dalia@empresa.cl" autocomplete="email" required />
        </label>

        <label class="field">
          <span>Contrasena</span>
          <input id="password" name="password" type="password" placeholder="Ingresa tu clave" autocomplete="current-password" required />
        </label>

        <button type="submit" class="btn btn-primary btn-block">Iniciar sesion</button>
      </form>

      <div id="login-status" class="status-card" hidden></div>

      <div class="auth-hint">
        <p>Demo rapido</p>
        <p class="muted">Prueba con cualquier correo y una contrasena de 4 caracteres o mas si PocketBase aun no esta activo.</p>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/pocketbase@0.21.5/dist/pocketbase.umd.js"></script>
  <script type="module" src="/assets/js/auth.js"></script>
</body>
</html>
