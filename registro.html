<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DalisApp | Registrar horas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body data-page="registro">
  <main class="phone-shell app-shell">
    <header class="topbar topbar--compact">
      <div class="row align-center gap-sm">
        <a href="/dashboard.html" class="back-link" aria-label="Volver al dashboard">Volver</a>
        <div>
          <p class="eyebrow on-dark">Formulario</p>
          <h1>Agregar horas extras</h1>
        </div>
      </div>
      <button class="icon-button" type="button" data-logout aria-label="Cerrar sesion">Salir</button>
    </header>

    <section class="content stack-lg">
      <section class="card">
        <div class="section-heading">
          <p class="eyebrow">Nuevo registro</p>
          <h2>Completa los datos</h2>
        </div>

        <form id="record-form" class="stack-md">
          <div class="two-col">
            <label class="field">
              <span>Tipo</span>
              <select id="type" name="type">
                <option value="earned">Horas ganadas</option>
                <option value="used">Horas usadas</option>
              </select>
            </label>

            <label class="field">
              <span>Fecha</span>
              <input id="date" name="date" type="date" required />
            </label>
          </div>

          <div class="two-col">
            <label class="field">
              <span>Hora inicio</span>
              <input id="start_time" name="start_time" type="time" required />
            </label>

            <label class="field">
              <span>Hora termino</span>
              <input id="end_time" name="end_time" type="time" required />
            </label>
          </div>

          <label class="field">
            <span>Total calculado</span>
            <input id="total_display" name="total_display" type="text" value="00:00 hrs" readonly />
          </label>

          <label class="field">
            <span>Observacion</span>
            <textarea id="notes" name="notes" rows="4" placeholder="Ej: soporte de cierre mensual o medio dia administrativo"></textarea>
          </label>

          <div class="button-row">
            <button type="submit" class="btn btn-primary">Guardar registro</button>
            <a href="/resumen.html" class="btn btn-secondary">Ver resumen</a>
          </div>
        </form>

        <div id="record-status" class="status-card" hidden></div>
      </section>

      <section class="card card--soft">
        <div class="row between align-start">
          <div>
            <p class="eyebrow">Ayuda visual</p>
            <h2>Como se interpreta</h2>
          </div>
          <span class="tag">MVP</span>
        </div>
        <div class="summary-list">
          <div>
            <span>Horas ganadas</span>
            <strong>Suman al disponible</strong>
          </div>
          <div>
            <span>Horas usadas</span>
            <strong>Descuentan del saldo</strong>
          </div>
          <div>
            <span>Total</span>
            <strong>Se calcula automaticamente</strong>
          </div>
        </div>
      </section>
    </section>

    <nav class="bottom-nav">
      <a href="/dashboard.html" data-nav="dashboard">Inicio</a>
      <a href="/registro.html" data-nav="registro">Registro</a>
      <a href="/resumen.html" data-nav="resumen">Resumen</a>
    </nav>
  </main>

  <script src="https://unpkg.com/pocketbase@0.21.5/dist/pocketbase.umd.js"></script>
  <script type="module" src="/assets/js/registros.js"></script>
</body>
</html>
