<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DalisApp | Resumen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dali: { 50: "#fff4fa", 100: "#fce7f3", 200: "#fbcfe8", 500: "#ec4899", 600: "#db2777", 700: "#be185d" },
          },
          fontFamily: {
            body: ["Nunito", "sans-serif"],
            title: ["Baloo 2", "cursive"],
          },
          boxShadow: {
            shell: "0 18px 40px rgba(190, 24, 93, 0.22)",
          },
        },
      },
    };
  </script>
</head>
<body data-page="resumen" class="min-h-screen bg-[radial-gradient(circle_at_top_left,rgba(255,255,255,0.35),transparent_30%),linear-gradient(180deg,#f8d6e8_0%,#fbcfe8_100%)] p-2 font-body text-slate-900 sm:p-5">
  <main class="mx-auto grid min-h-[calc(100vh-16px)] w-full max-w-[470px] grid-rows-[auto_1fr_auto] overflow-hidden rounded-[2.1rem] border-2 border-rose-200/80 bg-dali-100/90 shadow-shell backdrop-blur">
    <header class="flex items-center justify-between gap-3 bg-[radial-gradient(circle_at_top,rgba(255,255,255,0.18),transparent_40%),linear-gradient(135deg,#f067af_0%,#ec4899_72%)] px-5 py-4 text-white">
      <div class="flex items-center gap-3">
        <a href="/dashboard.html" class="inline-flex min-h-11 items-center justify-center rounded-full border border-white/45 bg-white/15 px-4 text-sm font-extrabold text-white backdrop-blur transition hover:translate-y-[-1px]" aria-label="Volver al dashboard">Volver</a>
        <div>
          <p class="text-xs font-extrabold uppercase tracking-[0.16em] text-pink-100">Historial</p>
          <h1 class="font-title text-3xl leading-none">Resumen mensual</h1>
        </div>
      </div>
      <button class="inline-flex min-h-11 items-center justify-center rounded-full border border-white/45 bg-white/15 px-4 text-sm font-extrabold text-white backdrop-blur transition hover:translate-y-[-1px]" type="button" data-logout aria-label="Cerrar sesion">Salir</button>
    </header>

    <section class="space-y-5 overflow-auto px-4 py-5">
      <section class="grid gap-3">
        <article class="rounded-[1.7rem] bg-[linear-gradient(180deg,rgba(255,255,255,0.96),rgba(252,231,243,0.98))] p-4 text-slate-900 shadow-lg">
          <p class="text-sm font-bold text-slate-500">Total trabajado</p>
          <strong data-summary-earned class="mt-2 block font-title text-5xl leading-none text-dali-700">00:00</strong>
          <span class="text-sm font-bold text-slate-500">hrs del mes</span>
        </article>
        <article class="rounded-[1.7rem] bg-[linear-gradient(180deg,#d94b92_0%,#be185d_100%)] p-4 text-white shadow-lg">
          <p class="text-sm font-bold text-pink-100">Total usado</p>
          <strong data-summary-used class="mt-2 block font-title text-5xl leading-none">00:00</strong>
          <span class="text-sm font-bold text-pink-100">hrs del mes</span>
        </article>
        <article class="rounded-[1.7rem] bg-[linear-gradient(180deg,#f675b5_0%,#ec4899_100%)] p-4 text-white shadow-lg">
          <p class="text-sm font-bold text-pink-100">Saldo disponible</p>
          <strong data-summary-balance class="mt-2 block font-title text-5xl leading-none">00:00</strong>
          <span class="text-sm font-bold text-pink-100">hrs disponibles</span>
        </article>
      </section>

      <section class="rounded-[1.75rem] border border-rose-100 bg-white/75 p-5 shadow-sm">
        <div class="flex flex-wrap items-end justify-between gap-3">
          <div>
            <p class="text-xs font-extrabold uppercase tracking-[0.16em] text-dali-700">Filtro</p>
            <h2 class="font-title text-3xl leading-none text-slate-900">Selecciona un mes</h2>
          </div>
          <label class="block min-w-[150px] space-y-2">
            <span class="font-bold text-slate-900">Mes</span>
            <input id="month-filter" type="month" class="w-full rounded-[1.15rem] border border-rose-200 bg-white px-4 py-3 text-base text-slate-700 outline-none transition focus:border-dali-500 focus:ring-4 focus:ring-dali-200/70" />
          </label>
        </div>
      </section>

      <section class="rounded-[1.75rem] border border-rose-100 bg-white/75 p-5 shadow-sm">
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="text-xs font-extrabold uppercase tracking-[0.16em] text-dali-700">Resumen amigable</p>
            <h2 data-table-title class="font-title text-3xl leading-none text-slate-900">Detalle del periodo</h2>
          </div>
          <a href="/registro.html" class="text-sm font-extrabold text-dali-700">Agregar horas</a>
        </div>

        <div class="mt-4 grid gap-3 sm:hidden" data-summary-cards></div>

        <div class="mt-4 hidden overflow-auto rounded-[1.35rem] border border-rose-100 sm:block">
          <table class="min-w-[720px] w-full border-collapse bg-white/90 text-sm">
            <thead class="bg-[linear-gradient(180deg,#ef5aa9_0%,#be185d_100%)] text-white">
              <tr>
                <th class="px-4 py-3 text-left font-extrabold">Fecha</th>
                <th class="px-4 py-3 text-left font-extrabold">Inicio</th>
                <th class="px-4 py-3 text-left font-extrabold">Termino</th>
                <th class="px-4 py-3 text-left font-extrabold">Total</th>
                <th class="px-4 py-3 text-left font-extrabold">Tipo</th>
                <th class="px-4 py-3 text-left font-extrabold">Observacion</th>
              </tr>
            </thead>
            <tbody data-summary-table-body></tbody>
          </table>
        </div>
      </section>
    </section>

    <nav class="grid grid-cols-3 gap-2 border-t border-rose-100 bg-white/90 p-2">
      <a href="/dashboard.html" data-nav="dashboard" class="inline-flex min-h-12 items-center justify-center rounded-2xl px-3 text-sm font-extrabold text-slate-500 transition">Inicio</a>
      <a href="/registro.html" data-nav="registro" class="inline-flex min-h-12 items-center justify-center rounded-2xl px-3 text-sm font-extrabold text-slate-500 transition">Registro</a>
      <a href="/resumen.html" data-nav="resumen" class="inline-flex min-h-12 items-center justify-center rounded-2xl px-3 text-sm font-extrabold text-slate-500 transition">Resumen</a>
    </nav>
  </main>

  <script src="https://unpkg.com/pocketbase@0.21.5/dist/pocketbase.umd.js"></script>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
