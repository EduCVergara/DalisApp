<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DalisApp | Resumen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body data-page="resumen">
  <main class="phone-shell app-shell">
    <header class="topbar topbar--compact">
      <div class="row align-center gap-sm">
        <a href="/dashboard.html" class="back-link" aria-label="Volver al dashboard">Volver</a>
        <div>
          <p class="eyebrow on-dark">Historial</p>
          <h1>Resumen mensual</h1>
        </div>
      </div>
      <button class="icon-button" type="button" data-logout aria-label="Cerrar sesion">Salir</button>
    </header>

    <section class="content stack-lg">
      <section class="card-grid">
        <article class="metric-card metric-card--light">
          <p>Total trabajado</p>
          <strong data-summary-earned>00:00</strong>
          <span>hrs del mes</span>
        </article>
        <article class="metric-card metric-card--secondary">
          <p>Total usado</p>
          <strong data-summary-used>00:00</strong>
          <span>hrs del mes</span>
        </article>
        <article class="metric-card metric-card--primary">
          <p>Saldo disponible</p>
          <strong data-summary-balance>00:00</strong>
          <span>hrs disponibles</span>
        </article>
      </section>

      <section class="card">
        <div class="row between align-end wrap">
          <div>
            <p class="eyebrow">Filtro</p>
            <h2>Selecciona un mes</h2>
          </div>
          <label class="field field--inline">
            <span>Mes</span>
            <input id="month-filter" type="month" />
          </label>
        </div>
      </section>

      <section class="card">
        <div class="row between align-start">
          <div>
            <p class="eyebrow">Tabla resumen</p>
            <h2 data-table-title>Detalle del periodo</h2>
          </div>
          <a href="/registro.html" class="link-strong">Agregar horas</a>
        </div>

        <div class="table-wrap">
          <table class="summary-table">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Inicio</th>
                <th>Termino</th>
                <th>Total</th>
                <th>Tipo</th>
                <th>Observacion</th>
              </tr>
            </thead>
            <tbody data-summary-table-body></tbody>
          </table>
        </div>
      </section>
    </section>

    <nav class="bottom-nav">
      <a href="/dashboard.html" data-nav="dashboard">Inicio</a>
      <a href="/registro.html" data-nav="registro">Registro</a>
      <a href="/resumen.html" data-nav="resumen">Resumen</a>
    </nav>
  </main>

  <script src="https://unpkg.com/pocketbase@0.21.5/dist/pocketbase.umd.js"></script>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
